
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimo · Mi peso</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#fdf7f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mimo">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
:root {
  --cream: #fdf7f7;
  --sand: #eddfd6;
  --taupe: #d3c0b1;
  --tan: #d1b39b;
  --blush: #e7c9c1;
  --rose: #d27786;
  --ink: #171717;
  --muted: #514b47;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
button, input { font: inherit; }
button { cursor: pointer; }
.app {
  max-width: 520px;
  min-height: 100dvh;
  margin: auto;
  padding: 30px 25px;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -2px;
}
.icons { display: flex; gap: 13px; }
.icon-btn {
  background: transparent;
  border: 0;
  color: var(--ink);
  padding: 7px;
}
.icon-btn svg {
  width: 26px;
  height: 26px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.screen {
  display: none;
  flex: 1;
  flex-direction: column;
}
.screen.active { display: flex; }
.center {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: var(--muted);
}
.weight-card {
  width: 100%;
  background: var(--sand);
  padding: 55px 12px;
  border-radius: 4px;
}
.big-weight {
  font-size: clamp(85px, 21vw, 125px);
  font-weight: 600;
  letter-spacing: -7px;
  line-height: 1.1;
  margin-top: 20px;
  font-variant-numeric: tabular-nums;
}
.unit { font-size: 20px; margin-top: 8px; }
.date {
  margin-top: 25px;
  font-size: 13px;
  color: var(--muted);
}
.btn {
  width: 100%;
  background: var(--rose);
  color: var(--ink);
  border: 0;
  padding: 20px;
  font-size: 15px;
  font-weight: 700;
  border-radius: 4px;
  margin-top: 14px;
}
.btn.secondary {
  background: var(--sand);
}
input {
  background: transparent;
  color: var(--ink);
  border: none;
  border-bottom: 2px solid var(--ink);
  width: 100%;
  padding: 15px;
  text-align: center;
  font-size: 75px;
  outline: none;
  border-radius: 0;
}
input::placeholder { color: #a69b96; }
input[type=date] {
  font-size: 19px;
  color-scheme: light;
}
h1 {
  font-size: 32px;
  letter-spacing: -1.5px;
  font-weight: 700;
  margin: 60px 0 15px;
}
.graph-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.goal-summary {
  margin-top: 25px;
  background: var(--blush);
  padding: 20px;
  border-radius: 4px;
  font-size: 17px;
  font-weight: 600;
  text-align: center;
}
.chart {
  width: 100%;
  height: 310px;
  margin-top: 25px;
}
.legend {
  font-size: 13px;
  text-align: center;
  color: var(--muted);
}
.empty {
  text-align: center;
  color: var(--muted);
  margin-top: 60px;
}
.record {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 20px 0;
  border-bottom: 1px solid var(--taupe);
}
.record-date {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 5px;
}
.record-weight {
  font-size: 26px;
  font-weight: 600;
}
.record-actions {
  display: flex;
  gap: 6px;
}
.small-btn {
  background: var(--sand);
  border: none;
  padding: 11px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 3px;
}
.delete { background: var(--blush); }
.palette {
  display: flex;
  height: 7px;
  gap: 3px;
  margin-top: 24px;
}
.palette div { flex: 1; }
</style>
</head>
<body>

<div class="app">

<header>
  <div class="logo">mimo.</div>
  <div class="icons">
    <button class="icon-btn" onclick="openGoal()" aria-label="Mi meta">
      <svg viewBox="0 0 24 24">
        <path d="M20.8 8.5c0 4.6-8.8 10-8.8 10s-8.8-5.4-8.8-10a4.6 4.6 0 0 1 8.8-1.7 4.6 4.6 0 0 1 8.8 1.7z"/>
        <path d="M18 1v4M16 3h4M22 11v3M20.5 12.5h3"/>
      </svg>
    </button>
    <button class="icon-btn" onclick="showScreen('graph')" aria-label="Gráfica">
      <svg viewBox="0 0 24 24">
        <path d="M3 3v18h18"/>
        <path d="m6 16 5-5 4 3 5-8"/>
      </svg>
    </button>
  </div>
</header>

<!-- INICIO -->
<section id="home" class="screen active">
  <div class="center">
    <div class="weight-card">
      <div class="label">ÚLTIMO PESO REGISTRADO</div>
      <div class="big-weight" id="weight">--</div>
      <div class="unit">kg</div>
      <div class="date" id="lastDate"></div>
    </div>
  </div>
  <button class="btn" onclick="openRegister()">+ Registrar peso</button>
</section>

<!-- REGISTRAR -->
<section id="register" class="screen">
  <div class="center">
    <div class="label">REGISTRAR MI PESO</div>
    <div style="width:100%;margin-top:40px">
      <input id="newWeight" type="number" min="1" max="500"
             step="0.1" inputmode="decimal" placeholder="00.0">
      <div class="unit" style="text-align:center">kg</div>
    </div>
  </div>
  <button class="btn" onclick="saveWeight()">Guardar peso</button>
  <button class="btn secondary" onclick="showScreen('home')">Cancelar</button>
</section>

<!-- META -->
<section id="goal" class="screen">
  <div class="center">
    <div class="label">MI PESO OBJETIVO</div>
    <div style="width:100%;margin-top:40px">
      <input id="goalWeight" type="number" min="1" max="500"
             step="0.1" inputmode="decimal" placeholder="00.0">
      <div class="unit" style="text-align:center">kg</div>
    </div>
  </div>
  <button class="btn" onclick="saveGoal()">Guardar meta</button>
  <button class="btn secondary" onclick="showScreen('home')">Cancelar</button>
</section>

<!-- GRÁFICA -->
<section id="graph" class="screen">
  <div class="graph-head">
    <h1>Tu evolución.</h1>
    <button class="icon-btn" onclick="showScreen('history')" aria-label="Editar registros">
      <svg viewBox="0 0 24 24">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4z"/>
      </svg>
    </button>
  </div>
  <div class="label">HISTORIAL DE PESO</div>
  <div id="goalInfo" class="goal-summary" style="display:none"></div>
  <svg id="chart" class="chart" viewBox="0 0 340 280"></svg>
  <div id="graphEmpty" class="empty"></div>
  <div id="goalLegend" class="legend"></div>
  <div style="flex:1"></div>
  <button class="btn secondary" onclick="showScreen('home')">Volver</button>
</section>

<!-- HISTORIAL -->
<section id="history" class="screen">
  <h1>Mis registros.</h1>
  <div class="label">EDITAR O ELIMINAR</div>
  <div id="recordList" style="margin-top:25px"></div>
  <div style="flex:1"></div>
  <button class="btn secondary" onclick="showScreen('graph')">Volver a la gráfica</button>
</section>

<!-- EDITAR -->
<section id="edit" class="screen">
  <div class="center">
    <div class="label">EDITAR REGISTRO</div>
    <div style="width:100%;margin-top:35px">
      <input id="editWeight" type="number" min="1" max="500"
             step="0.1" inputmode="decimal">
      <div class="unit" style="text-align:center">kg</div>
      <div class="label" style="margin-top:40px">FECHA</div>
      <input id="editDate" type="date">
    </div>
  </div>
  <button class="btn" onclick="saveEdit()">Guardar cambios</button>
  <button class="btn secondary" onclick="showScreen('history')">Cancelar</button>
</section>

<div class="palette">
  <div style="background:#fdf7f7"></div>
  <div style="background:#eddfd6"></div>
  <div style="background:#d3c0b1"></div>
  <div style="background:#d1b39b"></div>
  <div style="background:#e7c9c1"></div>
  <div style="background:#d27786"></div>
</div>
</div>

<script>
const KEY = "miPesoRegistros";
const GOAL_KEY = "miPesoMeta";
let records = [];
let goal = null;
let editIndex = -1;

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
  if (Array.isArray(saved)) records = saved;
} catch(e) {}

const storedGoal = localStorage.getItem(GOAL_KEY);
if (storedGoal !== null && Number(storedGoal) > 0) {
  goal = Number(storedGoal);
}

function localDate(date = new Date()) {
  const d = new Date(date);
  return d.getFullYear() + "-" +
    String(d.getMonth()+1).padStart(2,"0") + "-" +
    String(d.getDate()).padStart(2,"0");
}

function parseDate(s) {
  return new Date(s + "T12:00:00");
}

function formatWeight(n) {
  return Number(n).toLocaleString("es-ES", {
    minimumFractionDigits: 1,
    maximumFractionDigits: 2
  });
}

function formatDate(date) {
  return new Date(date).toLocaleDateString("es-ES", {
    day:"numeric", month:"long", year:"numeric"
  });
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(el =>
    el.classList.remove("active")
  );
  document.getElementById(id).classList.add("active");
  if (id === "graph") drawGraph();
  if (id === "history") renderHistory();
}

function sortedRecords() {
  return [...records].sort((a,b) =>
    new Date(a.date) - new Date(b.date)
  );
}

function updateHome() {
  const data = sortedRecords();
  if (!data.length) {
    document.getElementById("weight").textContent = "--";
    document.getElementById("lastDate").textContent =
      "Todavía no hay registros";
    return;
  }
  const last = data[data.length-1];
  document.getElementById("weight").textContent =
    formatWeight(last.weight);
  document.getElementById("lastDate").textContent =
    formatDate(last.date);
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(records));
    return true;
  } catch(e) {
    alert("No se han podido guardar los cambios.");
    return false;
  }
}

function validWeight(value) {
  return Number.isFinite(value) && value > 0 && value <= 500;
}

function openRegister() {
  document.getElementById("newWeight").value = "";
  showScreen("register");
}

function saveWeight() {
  const input = document.getElementById("newWeight");
  const value = Number(input.value);

  if (!input.value || !validWeight(value)) {
    alert("Introduce un peso válido.");
    return;
  }

  records.push({
    weight:value,
    date:new Date().toISOString()
  });

  if (!persist()) {
    records.pop();
    return;
  }
  updateHome();
  showScreen("home");
}

function openGoal() {
  document.getElementById("goalWeight").value =
    goal === null ? "" : goal;
  showScreen("goal");
}

function saveGoal() {
  const input = document.getElementById("goalWeight");
  const value = Number(input.value);

  if (!input.value || !validWeight(value)) {
    alert("Introduce un peso objetivo válido.");
    return;
  }

  try {
    localStorage.setItem(GOAL_KEY, String(value));
    goal = value;
    showScreen("home");
  } catch(e) {
    alert("No se ha podido guardar la meta.");
  }
}

function renderHistory() {
  const list = document.getElementById("recordList");
  list.innerHTML = "";

  const data = records.map((r,i) => ({...r,index:i}))
    .sort((a,b) => new Date(b.date)-new Date(a.date));

  if (!data.length) {
    list.innerHTML = '<div class="empty">No hay registros.</div>';
    return;
  }

  data.forEach(r => {
    const row = document.createElement("div");
    row.className = "record";

    const details = document.createElement("div");
    const date = document.createElement("div");
    date.className = "record-date";
    date.textContent = formatDate(r.date);
    const weight = document.createElement("div");
    weight.className = "record-weight";
    weight.textContent = formatWeight(r.weight) + " kg";
    details.append(date, weight);

    const actions = document.createElement("div");
    actions.className = "record-actions";

    const edit = document.createElement("button");
    edit.className = "small-btn";
    edit.textContent = "Editar";
    edit.onclick = () => openEdit(r.index);

    const del = document.createElement("button");
    del.className = "small-btn delete";
    del.textContent = "Borrar";
    del.onclick = () => deleteRecord(r.index);

    actions.append(edit, del);
    row.append(details, actions);
    list.appendChild(row);
  });
}

function openEdit(index) {
  editIndex = index;
  const r = records[index];
  document.getElementById("editWeight").value = r.weight;
  document.getElementById("editDate").value = localDate(r.date);
  showScreen("edit");
}

function saveEdit() {
  const input = document.getElementById("editWeight");
  const value = Number(input.value);
  const date = document.getElementById("editDate").value;

  if (!input.value || !validWeight(value) || !date ||
      Number.isNaN(parseDate(date).getTime())) {
    alert("Introduce un peso y una fecha válidos.");
    return;
  }

  const previous = {...records[editIndex]};
  records[editIndex] = {
    weight:value,
    date:parseDate(date).toISOString()
  };

  if (!persist()) {
    records[editIndex] = previous;
    return;
  }

  updateHome();
  showScreen("history");
}

function deleteRecord(index) {
  if (!confirm("¿Eliminar este registro?")) return;
  const previous = [...records];
  records.splice(index,1);

  if (!persist()) {
    records = previous;
    return;
  }

  updateHome();
  renderHistory();
}

function drawGraph() {
  const svg = document.getElementById("chart");
  const empty = document.getElementById("graphEmpty");
  const info = document.getElementById("goalInfo");
  const legend = document.getElementById("goalLegend");

  svg.innerHTML = "";
  empty.textContent = "";
  info.textContent = "";
  info.style.display = "none";
  legend.textContent = "";

  const data = sortedRecords();

  if (goal !== null) {
    legend.textContent = "♡ Meta: " + formatWeight(goal) + " kg";
  }

  if (!data.length) {
    empty.textContent = "Todavía no hay datos.";
    return;
  }

  const last = data[data.length-1].weight;
  if (goal !== null) {
    const diff = last - goal;
    info.style.display = "block";
    if (Math.abs(diff) < 0.01) {
      info.textContent = "¡Has alcanzado tu meta!";
    } else if (diff > 0) {
      info.textContent =
        "A " + formatWeight(diff) + " kg de tu meta";
    } else {
      info.textContent =
        "Estás " + formatWeight(-diff) + " kg por debajo de tu meta";
    }
  }

  const values = data.map(r => r.weight);
  if (goal !== null) values.push(goal);

  const min = Math.min(...values) - 2;
  const max = Math.max(...values) + 2;
  const left=42, right=320, top=25, bottom=235;

  const x = i => data.length === 1
    ? (left+right)/2
    : left+i*(right-left)/(data.length-1);
  const y = v => bottom-(v-min)/(max-min)*(bottom-top);

  function element(tag,attrs,content) {
    const el = document.createElementNS(
      "http://www.w3.org/2000/svg",tag
    );
    Object.entries(attrs).forEach(([k,v]) =>
      el.setAttribute(k,v)
    );
    if (content !== undefined) el.textContent=content;
    svg.appendChild(el);
    return el;
  }

  for(let i=0;i<=4;i++) {
    const value=min+(max-min)*i/4;
    const yy=y(value);
    element("line",{
      x1:left,y1:yy,x2:right,y2:yy,
      stroke:"#d3c0b1","stroke-width":1
    });
    element("text",{
      x:34,y:yy+4,fill:"#514b47",
      "font-size":10,"text-anchor":"end"
    },value.toFixed(1));
  }

  if(goal!==null) {
    element("line",{
      x1:left,y1:y(goal),x2:right,y2:y(goal),
      stroke:"#d27786","stroke-width":2,
      "stroke-dasharray":"6 5"
    });
    element("text",{
      x:right,y:y(goal)-8,fill:"#171717",
      "font-size":11,"font-weight":"bold",
      "text-anchor":"end"
    },"META");
  }

  const points=data.map((r,i) =>
    x(i)+","+y(r.weight)
  ).join(" ");

  element("polyline",{
    points,fill:"none",stroke:"#171717",
    "stroke-width":2.5,
    "stroke-linecap":"round",
    "stroke-linejoin":"round"
  });

  data.forEach((r,i)=>{
    const dot=element("circle",{
      cx:x(i),cy:y(r.weight),r:4,fill:"#171717"
    });
    const title=document.createElementNS(
      "http://www.w3.org/2000/svg","title"
    );
    title.textContent =
      formatDate(r.date)+": "+formatWeight(r.weight)+" kg";
    dot.appendChild(title);
  });

  element("text",{
    x:left,y:265,fill:"#514b47",
    "font-size":11,"text-anchor":"start"
  },new Date(data[0].date).toLocaleDateString("es-ES"));

  element("text",{
    x:right,y:265,fill:"#514b47",
    "font-size":11,"text-anchor":"end"
  },new Date(data[data.length-1].date).toLocaleDateString("es-ES"));
}

updateHome();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .catch(error => console.warn('No se pudo registrar el modo sin conexión:', error));
  });
}
</script>
</body>
</html>
